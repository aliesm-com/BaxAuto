# BaxAuto — API image bundles DB client tools so backups work without installing pg_dump on Windows.
services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - '8080:80'
    volumes:
      - ./client/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    ports:
      - '4173:80'

  # Runs each job at the interval/cron the user saved (not a hardcoded 15 minutes).
  scheduler:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
    depends_on:
      - api
    restart: unless-stopped
    command: >
      sh -c "sleep 8 &&
             while true; do python manage.py scheduler_tick; sleep 60; done"
