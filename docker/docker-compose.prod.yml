version: '3.8'

services:
  # ─────────────────────────────────────────
  #  BaxAuto Postgres — catalog (users, jobs, connections)
  # ─────────────────────────────────────────
  baxauto-postgres:
    image: postgres:16-alpine
    container_name: baxauto-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baxauto}
      POSTGRES_USER: ${POSTGRES_USER:-baxauto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-baxauto}
    volumes:
      - baxauto_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-baxauto} -d ${POSTGRES_DB:-baxauto}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - devopsio
    dns:
      - 194.225.152.12
      - 194.225.152.10

  # ─────────────────────────────────────────
  #  BaxAuto API — Django/Gunicorn + dump/restore client tools
  # ─────────────────────────────────────────
  baxauto-api:
    image: baxauto-api:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: baxauto-api-prod
    entrypoint: ["/bin/sh", "/entrypoint.prod.sh"]
    volumes:
      - ../server:/app
      - baxauto_logs_prod:/logs
      - baxauto_static_prod:/app/staticfiles
      - baxauto_media_prod:/app/media
    ports:
      - "${HOST_IP:-127.0.0.1}:${BAXAUTO_API_PORT:-18200}:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        compress: "true"
    env_file:
      - ../.env
    environment:
      - TZ=Asia/Tehran
      - TIME_ZONE=Asia/Tehran
      - DEBUG=False
      - DATABASE_URL=postgresql://${POSTGRES_USER:-baxauto}:${POSTGRES_PASSWORD:-baxauto}@baxauto-postgres:5432/${POSTGRES_DB:-baxauto}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      - DB_CREDENTIALS_FERNET_KEY=${DB_CREDENTIALS_FERNET_KEY:-}
      - LOGS_DIR=/logs
    depends_on:
      - baxauto-postgres
    restart: unless-stopped
    networks:
      - devopsio
    dns:
      - 194.225.152.12
      - 194.225.152.10

  # ─────────────────────────────────────────
  #  BaxAuto Dashboard — React control plane (nginx → API)
  # ─────────────────────────────────────────
  baxauto-dashboard:
    build:
      context: ../client
      dockerfile: Dockerfile
    container_name: baxauto-dashboard-prod
    ports:
      - "${HOST_IP:-127.0.0.1}:${BAXAUTO_DASHBOARD_PORT:-18280}:80"
    volumes:
      - ../client/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - baxauto-api
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
        compress: "true"
    networks:
      - devopsio
    dns:
      - 194.225.152.12
      - 194.225.152.10

  # ─────────────────────────────────────────
  #  BaxAuto Landing — Astro marketing site
  # ─────────────────────────────────────────
  baxauto-landing:
    build:
      context: ../landing
      dockerfile: Dockerfile
    container_name: baxauto-landing-prod
    ports:
      - "${HOST_IP:-127.0.0.1}:${BAXAUTO_LANDING_PORT:-18417}:80"
    volumes:
      - ../landing/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        compress: "true"
    networks:
      - devopsio
    dns:
      - 194.225.152.12
      - 194.225.152.10

  # ─────────────────────────────────────────
  #  BaxAuto Scheduler — ticks saved backup/restore jobs
  # ─────────────────────────────────────────
  baxauto-scheduler:
    image: baxauto-api:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: baxauto-scheduler-prod
    entrypoint: ["/bin/sh", "-c"]
    command:
      - sleep 8 && while true; do python manage.py scheduler_tick; sleep 60; done
    volumes:
      - ../server:/app
      - baxauto_logs_prod:/logs
      - baxauto_media_prod:/app/media
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        compress: "true"
    env_file:
      - ../.env
    environment:
      - TZ=Asia/Tehran
      - TIME_ZONE=Asia/Tehran
      - DEBUG=False
      - DATABASE_URL=postgresql://${POSTGRES_USER:-baxauto}:${POSTGRES_PASSWORD:-baxauto}@baxauto-postgres:5432/${POSTGRES_DB:-baxauto}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DB_CREDENTIALS_FERNET_KEY=${DB_CREDENTIALS_FERNET_KEY:-}
      - LOGS_DIR=/logs
    depends_on:
      - baxauto-postgres
      - baxauto-api
    restart: unless-stopped
    networks:
      - devopsio
    dns:
      - 194.225.152.12
      - 194.225.152.10

volumes:
  baxauto_pgdata_prod:
  baxauto_logs_prod:
  baxauto_static_prod:
  baxauto_media_prod:

networks:
  devopsio:
    name: devopsio
    external: true
